<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docket demo — Prim</title>
  <meta name="description" content="Download a docket prim. Drop it on the chat. It becomes the editor.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f3ef;
      --raised: #fffcf8;
      --ink: #111111;
      --muted: #6a6a66;
      --subtle: #8a8a84;
      --line: #e4e2dc;
      --radius: 20px;
      --bg: #08090a;
      --side: #0f1011;
      --elev: #141516;
      --hover: #18191b;
      --active: #1c1c1f;
      --eline: #232326;
      --text: #f7f8f8;
      --mute: #8a8f98;
      --faint: #62666d;
      --accent: #5e6ad2;
      --todo: #8a8f98;
      --progress: #f2c14e;
      --blocked: #eb5757;
      --done: #5e6ad2;
      --draft: #6b7180;
      --high: #eb5757;
      --medium: #f2c14e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      background: var(--paper);
      color: var(--ink);
      font-family: "Instrument Sans", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .inbox {
      display: flex; flex-direction: column; min-height: 0;
      border-right: 1px solid var(--line); background: var(--paper);
    }
    .inbox-head {
      height: 4rem; display: flex; align-items: center; gap: 10px;
      padding: 0 1rem; border-bottom: 1px solid var(--line);
    }
    .inbox-head img { height: 1.75rem; }
    .inbox-head b { font-weight: 500; letter-spacing: -0.02em; }
    .chats { flex: 1; overflow: auto; padding: 8px; }
    .chat-item {
      display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center;
      width: 100%; margin: 0 0 4px; padding: 10px; border: 1px solid transparent;
      border-radius: 14px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .chat-item:hover { background: var(--raised); }
    .chat-item.on { background: var(--raised); border-color: var(--line); }
    .chat-item .face { width: 36px; height: 36px; }
    .chat-item .name { font-weight: 500; letter-spacing: -0.02em; }
    .chat-item .preview { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scrim { display: none; }
    .menu {
      display: none; width: 36px; height: 36px; margin-right: 4px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--raised);
      font: inherit; cursor: pointer;
    }
    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--paper); }
    .chat-bar {
      height: 4rem; display: flex; align-items: center; gap: 12px;
      padding: 0 1.25rem;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
      background: color-mix(in srgb, var(--paper) 90%, transparent);
      backdrop-filter: blur(8px);
    }
    .chat-bar a.home { display: flex; align-items: center; }
    .chat-bar img { height: 1.75rem; width: auto; }
    .who { display: grid; line-height: 1.2; }
    .who b { font-weight: 500; letter-spacing: -0.02em; }
    .who small { color: var(--subtle); font-size: 12px; font-weight: 400; }
    .chat-bar .dl {
      margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 12px;
      color: var(--muted); text-decoration: none; border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 10px; background: var(--raised);
    }
    .chat-bar .dl:hover { color: var(--ink); }
    .thread { flex: 1; min-height: 0; overflow: auto; padding: 1.5rem 1.5rem 1rem; }
    .day {
      display: flex; align-items: center; gap: 1rem;
      margin: 0 0 1.25rem; color: var(--subtle);
      font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .row { display: flex; gap: 10px; margin: 0 0 14px; max-width: 36rem; opacity: 0; transform: translateY(8px); animation: in 420ms ease forwards; }
    .row.tool { max-width: none; }
    .row.them { }
    .row.me { margin-left: auto; flex-direction: row-reverse; }
    .face {
      width: 28px; height: 28px; border-radius: 8px; flex: none;
      display: grid; place-items: center; background: var(--ink);
    }
    .face img { height: 14px; width: auto; filter: invert(1); }
    .row.me .face { background: var(--raised); border: 1px solid var(--line); }
    .row.me .face img { filter: none; }
    .stack { min-width: 0; }
    .meta {
      font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--subtle); margin: 0 0 5px;
    }
    .bubble {
      padding: 12px 16px; border-radius: var(--radius); line-height: 1.45; font-size: 1.02rem;
      border: 1px solid var(--line); background: var(--raised);
    }
    .row.me .bubble { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .typing { display: flex; gap: 5px; padding: 14px 16px; width: fit-content; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--subtle); animation: pulse 1s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @keyframes in { to { opacity: 1; transform: none; } }
    .drop {
      margin: 8px 0 0; max-width: 40rem; min-height: 7.5rem;
      border: 1px dashed var(--line); border-radius: var(--radius);
      background: var(--raised); display: grid; place-items: center;
      text-align: center; color: var(--muted); padding: 1.4rem 1.5rem; cursor: pointer;
    }
    .drop.over { border-style: solid; border-color: var(--ink); color: var(--ink); }
    .drop .label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--subtle); }
    .drop strong { display: block; margin: 0.4rem 0 0.2rem; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
    .attach {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
    }
    .attach .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    .attach small { display: block; color: var(--subtle); font-size: 11px; }
    .composer {
      display: flex; align-items: center; gap: 10px;
      margin: 0 1.5rem 1.25rem; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 16px; background: var(--raised);
    }
    .composer .tag {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--subtle);
    }
    .composer input {
      flex: 1; border: 0; background: transparent; font: inherit; color: var(--ink); outline: none;
    }
    .composer button {
      height: 34px; padding: 0 12px; border: 0; border-radius: 10px;
      background: var(--ink); color: var(--paper); font: inherit; font-weight: 500; cursor: pointer;
    }
    .row.tool .bubble { padding: 0; overflow: hidden; width: min(100%, 72rem); background: #08090a; border-color: var(--ink); }
    .editor-card { height: min(58vh, 620px); background: #08090a; }
    .app { width: 100%; min-width: 0; height: 100%; }
    .app {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "SF Pro Text", sans-serif;
      font-size: 13px;
    }
    .app.sheet-on { grid-template-columns: 220px minmax(0, 1fr) minmax(300px, 400px); }
    .app aside { background: var(--side); border-right: 1px solid var(--eline); padding: 14px 10px; overflow: auto; }
    .workspace { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
    .mark-team { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #5e6ad2, #8b93e8); }
    .workspace h1 { margin: 0; font-size: 13px; font-weight: 500; }
    .workspace small { display: block; color: var(--faint); font-size: 11px; }
    .nav-item, .new {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; height: 30px; padding: 0 8px; border: 0; border-radius: 6px;
      background: transparent; color: var(--mute); font: inherit; cursor: pointer;
    }
    .new { height: 32px; margin-bottom: 12px; border: 1px solid var(--eline); background: var(--elev); color: var(--text); }
    .nav-item.on, .nav-item:hover, .new:hover { background: var(--active); color: var(--text); }
    .nav-item span { display: flex; align-items: center; gap: 8px; }
    .count { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11px; }
    main.ed { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
    .toolbar { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-bottom: 1px solid var(--eline); }
    .toolbar h2 { margin: 0; font-size: 13px; font-weight: 500; }
    .views { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--eline); border-radius: 7px; }
    .views button { width: 28px; height: 24px; border: 0; border-radius: 5px; background: transparent; color: var(--faint); cursor: pointer; }
    .views button.on { background: var(--active); color: var(--text); }
    .list { flex: 1; min-height: 0; overflow: auto; }
    .list:has(.board) { overflow: hidden; display: flex; }
    .rowi {
      display: grid; grid-template-columns: 16px 52px minmax(0,1fr) auto auto;
      align-items: center; gap: 10px; height: 36px; padding: 0 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer;
    }
    .rowi:hover { background: var(--hover); }
    .rowi.on { background: var(--active); }
    .tid { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--faint); }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .chip { padding: 1px 7px; border: 1px solid var(--eline); border-radius: 999px; color: var(--mute); font-size: 11px; }
    .icon { width: 14px; height: 14px; display: block; }
    .icon circle { fill: none; stroke-width: 1.5; }
    .icon.todo circle { stroke: var(--todo); }
    .icon.draft circle { stroke: var(--draft); stroke-dasharray: 2.2 1.8; }
    .icon.progress circle { stroke: var(--progress); }
    .icon.progress path { fill: var(--progress); stroke: none; }
    .icon.blocked circle, .icon.blocked path { stroke: var(--blocked); }
    .icon.done circle { fill: var(--done); stroke: var(--done); }
    .icon.done path { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; }
    .pri { width: 14px; height: 14px; color: var(--faint); }
    .pri.high { color: var(--high); }
    .pri.medium { color: var(--medium); }
    .board { display: flex; gap: 10px; flex: 1; padding: 12px; overflow: auto; }
    .col { display: flex; flex-direction: column; flex: 0 0 260px; border: 1px solid var(--eline); border-radius: 8px; background: #0c0d0e; }
    .col.over { outline: 1px solid var(--accent); }
    .col-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; color: var(--mute); font-size: 12px; }
    .col-head .count { margin-left: auto; }
    .col-body { flex: 1; overflow: auto; padding: 8px; }
    .card { padding: 10px; margin-bottom: 8px; border: 1px solid var(--eline); border-radius: 8px; background: var(--elev); cursor: grab; }
    .card-title { font-weight: 500; margin-bottom: 8px; }
    .card-meta { display: flex; align-items: center; gap: 8px; }
    .sheet { overflow: auto; background: var(--elev); border-left: 1px solid var(--eline); padding: 22px; }
    .issue-id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--faint); }
    .title-edit, .notes, .sheet select, .blocked-edit {
      width: 100%; background: transparent; color: var(--text); border: 1px solid transparent;
      border-radius: 6px; font: inherit;
    }
    .title-edit { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; margin: 6px 0 16px; resize: none; }
    .prop { display: grid; grid-template-columns: 92px 1fr; align-items: center; min-height: 32px; color: var(--faint); font-size: 12px; }
    .notes { min-height: 140px; color: #d0d6e0; font-size: 14px; line-height: 1.55; }
    .empty { color: var(--faint); padding: 28px 16px; }
    .row.tool .bubble { width: 100%; }
    .editor-card { height: min(70vh, 820px); }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      .inbox {
        position: fixed; inset: 0 auto 0 0; width: min(88vw, 300px); z-index: 20;
        transform: translateX(-105%); transition: transform 180ms ease;
        box-shadow: 16px 0 40px rgba(17,17,17,0.08);
      }
      body.show-chats .inbox { transform: none; }
      .scrim {
        display: none; position: fixed; inset: 0; z-index: 15;
        background: color-mix(in srgb, var(--ink) 28%, transparent);
      }
      body.show-chats .scrim { display: block; }
      .menu { display: grid; place-items: center; }
      .row { max-width: 100%; }
      .composer { margin: 0 0.85rem 0.85rem; }
      .thread { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="scrim" id="scrim"></div>
  <aside class="inbox" id="inbox">
    <div class="inbox-head">
      <a href="/"><img src="../../mark.png" alt="Prim"></a>
      <b>Chats</b>
    </div>
    <nav class="chats">
      <button class="chat-item on" type="button" data-chat="docket">
        <span class="face"><img src="../../mark.png" alt=""></span>
        <span><span class="name">Docket</span><span class="preview">Send me the prim.</span></span>
      </button>
      <button class="chat-item" type="button" data-chat="deck">
        <span class="face"><img src="../../mark.png" alt=""></span>
        <span><span class="name">Deck</span><span class="preview">Don’t send the slides.</span></span>
      </button>
      <button class="chat-item" type="button" data-chat="invoice">
        <span class="face"><img src="../../mark.png" alt=""></span>
        <span><span class="name">Invoice</span><span class="preview">The pack is the bill.</span></span>
      </button>
      <button class="chat-item" type="button" data-chat="session">
        <span class="face"><img src="../../mark.png" alt=""></span>
        <span><span class="name">Session</span><span class="preview">Pick up the same file.</span></span>
      </button>
    </nav>
  </aside>
  <section class="stage">
    <div class="chat-bar">
      <button class="menu" id="menu" type="button" aria-label="Chats">☰</button>
      <a class="home" href="/"><img src="../../mark.png" alt="Prim"></a>
      <div class="who"><b id="title">Docket</b><small id="sub">bot · the file is the message</small></div>
      <a class="dl" href="./atlas.docket.prim" download="atlas.docket.prim">atlas.docket.prim</a>
    </div>
    <div class="thread" id="thread">
      <div class="day">Today</div>
      <div id="log"></div>
      <div id="other" hidden></div>
      <div class="drop" id="drop" hidden>
        <div>
          <p class="label">Attach</p>
          <strong>Drop a .prim here</strong>
          or click to choose the file
        </div>
        <input id="file" type="file" accept=".prim,.zip,.json,.jsonl" hidden>
      </div>
    </div>
    <form class="composer" id="composer">
      <button class="tag" type="button" id="attach">.prim</button>
      <input id="prompt" placeholder="Message Prim…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
  <script type="module">
    import { unzipSync, strFromU8 } from "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js";

    const COLUMNS = ["To Do", "In Progress", "Done", "Draft"];
    let pack = { project: { name: "docket" }, tasks: [], milestones: [] };
    let selected = "";
    let view = "board";
    let filter = "all";

    const drop = document.getElementById("drop");
    const file = document.getElementById("file");
    const log = document.getElementById("log");
    const thread = document.getElementById("thread");
    const prompt = document.getElementById("prompt");
    drop.addEventListener("click", () => file.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });
    file.addEventListener("change", () => { if (file.files[0]) openFile(file.files[0]); });
    document.getElementById("attach").addEventListener("click", () => file.click());
    document.getElementById("menu").addEventListener("click", () => document.body.classList.toggle("show-chats"));
    document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("show-chats"));
    document.querySelectorAll("[data-chat]").forEach((el) => {
      el.addEventListener("click", () => openChat(el.dataset.chat));
    });

    const rooms = {
      docket: { title: "Docket", sub: "bot · the file is the message" },
      deck: { title: "Deck", sub: "bot · slides come out of the file" },
      invoice: { title: "Invoice", sub: "bot · the pack is the bill" },
      session: { title: "Session", sub: "bot · pick up the same file" },
    };
    function openChat(id) {
      document.querySelectorAll("[data-chat]").forEach((el) => el.classList.toggle("on", el.dataset.chat === id));
      document.getElementById("title").textContent = rooms[id].title;
      document.getElementById("sub").textContent = rooms[id].sub;
      document.body.classList.remove("show-chats");
      const other = document.getElementById("other");
      const live = id === "docket";
      log.hidden = !live;
      drop.hidden = !live || pack.tasks.length > 0;
      other.hidden = live;
      if (live) return;
      const lines = {
        deck: "This thread would open a deck prim. Same split: file + editor. Switch to Docket to drop a file.",
        invoice: "This thread would open an invoice prim. The pack is the bill. Docket is the live bot in this demo.",
        session: "A session is a prim too. This demo only opens a docket. Switch back to drop the file.",
      };
      other.innerHTML = `
        <div class="row them" style="opacity:1;transform:none">
          <div class="face"><img src="../../mark.png" alt=""></div>
          <div class="stack"><div class="meta">Prim</div><div class="bubble">${lines[id]}</div></div>
        </div>`;
    }
    document.getElementById("composer").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = prompt.value.trim();
      if (!text) return;
      prompt.value = "";
      add("me", esc(text));
      reply(text);
    });

    function add(who, html, extra) {
      const row = document.createElement("div");
      row.className = "row " + who + (extra ? " " + extra : "");
      row.innerHTML = `
        <div class="face"><img src="../../mark.png" alt=""></div>
        <div class="stack">
          <div class="meta">${who === "me" ? "You" : "Prim"}</div>
          <div class="bubble">${html}</div>
        </div>`;
      log.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      return row;
    }
    function attachHTML(name, note) {
      return `<div class="attach"><div><span class="mono">${name}</span><small>${note}</small></div></div>`;
    }
    function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
    async function say(html) {
      const typing = add("them", `<div class="typing"><i></i><i></i><i></i></div>`);
      await sleep(480);
      typing.remove();
      add("them", html);
    }
    async function play() {
      await say("Don’t send the spreadsheet.");
      await say("Send me the prim. I can open a docket editor on it.");
      await say(`Need a file? <a href="./atlas.docket.prim" download="atlas.docket.prim">Download atlas.docket.prim</a> — 2 KB — then drop it here or tap <span class="mono">.prim</span>.`);
      drop.hidden = false;
    }
    play();

    async function reply(text) {
      const q = text.toLowerCase();
      if (!pack.tasks.length) {
        if (/download|sample|file|docket|prim/.test(q)) {
          await say(`Here: <a href="./atlas.docket.prim" download="atlas.docket.prim">atlas.docket.prim</a>. Drop it on the thread and I’ll open it.`);
          drop.hidden = false;
          return;
        }
        await say("I need the file first. Download the sample or attach a .prim.");
        return;
      }
      const blocked = pack.tasks.filter((t) => t.blocked_reason);
      const todo = pack.tasks.filter((t) => t.status === "To Do");
      if (/block/.test(q)) {
        await say(blocked.length ? blocked.map((t) => `${t.id} ${t.title} — ${t.blocked_reason}`).join("<br>") : "Nothing is blocked.");
        return;
      }
      if (/todo|to do|open/.test(q)) {
        await say(`${todo.length} to do: ${todo.map((t) => t.title).join("; ") || "none"}.`);
        return;
      }
      if (/what|status|how many|board/.test(q)) {
        await say(`${pack.project.name}: ${pack.tasks.length} issues. The board above cites this file. Drag a card to change status.`);
        return;
      }
      await say("Still this thread. The editor is just a tool I opened on the file you sent.");
    }

    async function openFile(f) {
      pack = await readPack(f);
      add("me", attachHTML(f.name || "atlas.docket.prim", "attached"));
      await say("Opened. The editor cites the pack — it isn’t a copy.");
      const tool = add("them", `<div class="editor-card" id="frame"></div>`, "tool");
      drop.hidden = true;
      render();
      await say("You can keep talking. Ask what’s blocked, or what’s to do.");
      thread.scrollTop = tool.offsetTop;
    }

    async function readPack(f) {
      const buf = new Uint8Array(await f.arrayBuffer());
      if (buf[0] === 0x50 && buf[1] === 0x4b) {
        const files = unzipSync(buf);
        const get = (name) => {
          const key = Object.keys(files).find((k) => k.replace(/^.*\//, "") === name);
          return key ? strFromU8(files[key]) : "";
        };
        return fromTexts(get("docket.json"), get("tasks.jsonl"), get("milestones.jsonl"));
      }
      const text = new TextDecoder().decode(buf);
      if (text.trim().startsWith("{") && text.includes('"tasks"')) {
        const j = JSON.parse(text);
        return { project: j.project || { name: j.name || f.name }, tasks: j.tasks || [], milestones: j.milestones || [] };
      }
      return fromTexts("{}", text, "");
    }

    function fromTexts(meta, tasks, miles) {
      let project = { name: "docket" };
      try { if (meta.trim()) project = { name: "docket", ...JSON.parse(meta) }; } catch {}
      return {
        project,
        tasks: jsonl(tasks),
        milestones: jsonl(miles),
      };
    }
    function jsonl(s) {
      return String(s || "").split(/\n/).map((l) => l.trim()).filter(Boolean).map((l) => JSON.parse(l));
    }

    function kind(t) {
      if (t.blocked_reason) return "blocked";
      if (t.status === "In Progress") return "progress";
      if (t.status === "Done") return "done";
      if (t.status === "Draft") return "draft";
      return "todo";
    }
    function statusMark(t) {
      const k = kind(t);
      if (k === "done") return `<svg class="icon done" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M4.2 7.1l1.8 1.8 3.8-3.8"/></svg>`;
      if (k === "progress") return `<svg class="icon progress" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M7 2.2A4.8 4.8 0 0 1 11.8 7H7z"/></svg>`;
      if (k === "blocked") return `<svg class="icon blocked" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M4.2 4.2l5.6 5.6"/></svg>`;
      return `<svg class="icon ${k}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/></svg>`;
    }
    function priMark(p) {
      const n = p === "high" ? 3 : p === "medium" ? 2 : p === "low" ? 1 : 0;
      if (!n) return `<svg class="pri" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.6 1.5"/></svg>`;
      return `<svg class="pri ${p}" viewBox="0 0 14 14">${[[3,10],[6,8],[9,6]].slice(0,n).map(([x,h]) => `<rect x="${x}" y="${12-h}" width="2" height="${h}" rx="0.6" fill="currentColor"/>`).join("")}</svg>`;
    }
    function msTitle(id) {
      return (pack.milestones.find((m) => m.id === id) || {}).title || id;
    }
    function visible() {
      return pack.tasks.filter((t) => {
        if (filter === "blocked") return !!t.blocked_reason;
        if (filter !== "all" && t.status !== filter) return false;
        return true;
      });
    }
    function counts() {
      const c = { all: pack.tasks.length, "To Do": 0, "In Progress": 0, Done: 0, Draft: 0, blocked: 0 };
      for (const t of pack.tasks) {
        c[t.status] = (c[t.status] || 0) + 1;
        if (t.blocked_reason) c.blocked += 1;
      }
      return c;
    }

    function render() {
      const c = counts();
      const t = pack.tasks.find((x) => x.id === selected);
      const filters = [["all","All issues"],["To Do","Todo"],["In Progress","In Progress"],["Done","Done"],["Draft","Draft"],["blocked","Blocked"]];
      document.getElementById("frame").innerHTML = `
        <div class="app ${t ? "sheet-on" : ""}" id="app">
          <aside>
            <div class="workspace"><div class="mark-team"></div><div><h1>${esc(pack.project.name || "docket")}</h1><small>docket editor · cites this file</small></div></div>
            ${filters.map(([id, label]) => `<button class="nav-item ${filter===id?"on":""}" data-filter="${id}"><span>${statusMark({status:id==="In Progress"?"In Progress":id==="Done"?"Done":id==="Draft"?"Draft":"To Do", blocked_reason:id==="blocked"?"x":""})}${label}</span><span class="count">${c[id]||0}</span></button>`).join("")}
          </aside>
          <main class="ed">
            <div class="toolbar">
              <h2>${filter==="all"?"All issues":filter}</h2>
              <div class="views">
                <button type="button" data-view="list" class="${view==="list"?"on":""}" title="List">≡</button>
                <button type="button" data-view="board" class="${view==="board"?"on":""}" title="Board">▣</button>
              </div>
            </div>
            <div class="list">${view==="board"?boardHTML():listHTML()}</div>
          </main>
          ${t ? sheetHTML(t) : ""}
        </div>`;
      bind();
    }

    function listHTML() {
      const rows = visible();
      if (!rows.length) return '<div class="empty">No issues.</div>';
      return rows.map((t) => `
        <div class="rowi ${t.id===selected?"on":""}" data-id="${t.id}">
          ${statusMark(t)}<span class="tid">${t.id.replace("TASK-","")}</span>
          <span class="title">${esc(t.title)}</span>
          ${t.milestone?`<span class="chip">${esc(msTitle(t.milestone))}</span>`:"<span></span>"}
          ${priMark(t.priority)}
        </div>`).join("");
    }

    function boardHTML() {
      const cols = filter !== "all" && filter !== "blocked" ? [filter] : COLUMNS;
      return `<div class="board">${cols.map((status) => {
        const cards = visible().filter((t) => t.status === status);
        return `<section class="col" data-status="${status}">
          <div class="col-head">${statusMark({status})}${status==="To Do"?"Todo":status}<span class="count">${cards.length}</span></div>
          <div class="col-body">${cards.map((t) => `
            <article class="card" data-id="${t.id}" draggable="true">
              <div class="card-title">${esc(t.title)}</div>
              <div class="card-meta">
                <span class="tid">${t.id.replace("TASK-","")}</span>
                ${t.blocked_reason?'<span class="chip" style="color:var(--blocked)">Blocked</span>':""}
                ${t.milestone?`<span class="chip">${esc(msTitle(t.milestone))}</span>`:""}
                <span style="margin-left:auto">${priMark(t.priority)}</span>
              </div>
            </article>`).join("")}</div>
        </section>`;
      }).join("")}</div>`;
    }

    function sheetHTML(t) {
      const ms = pack.milestones.map((m) => `<option value="${esc(m.id)}" ${m.id===t.milestone?"selected":""}>${esc(m.title)}</option>`).join("");
      return `<section class="sheet">
        <div class="issue-id">${esc(t.id)}</div>
        <textarea class="title-edit" data-field="title">${esc(t.title)}</textarea>
        <label class="prop"><span>Status</span><select data-field="status">${["To Do","In Progress","Done","Draft"].map((s)=>`<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select></label>
        <label class="prop"><span>Priority</span><select data-field="priority">${["","high","medium","low"].map((s)=>`<option value="${s}" ${s===(t.priority||"")?"selected":""}>${s||"No priority"}</option>`).join("")}</select></label>
        <label class="prop"><span>Milestone</span><select data-field="milestone"><option value="">No milestone</option>${ms}</select></label>
        <label class="prop"><span>Blocked</span><input class="blocked-edit" data-field="blocked_reason" value="${esc(t.blocked_reason||"")}"></label>
        <textarea class="notes" data-field="notes" placeholder="Add description…">${esc(t.notes||"")}</textarea>
      </section>`;
    }

    function bind() {
      document.querySelectorAll("[data-filter]").forEach((el) => el.addEventListener("click", () => { filter = el.dataset.filter; render(); }));
      document.querySelectorAll("[data-view]").forEach((el) => el.addEventListener("click", () => { view = el.dataset.view; render(); }));
      document.querySelectorAll(".rowi, .card").forEach((el) => el.addEventListener("click", () => { selected = el.dataset.id; render(); }));
      document.querySelectorAll("[data-field]").forEach((el) => {
        const ev = el.tagName === "SELECT" ? "change" : "blur";
        el.addEventListener(ev, () => {
          const t = pack.tasks.find((x) => x.id === selected);
          if (t) { t[el.dataset.field] = el.value; render(); }
        });
      });
      document.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", el.dataset.id));
      });
      document.querySelectorAll(".col").forEach((col) => {
        col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
        col.addEventListener("dragleave", () => col.classList.remove("over"));
        col.addEventListener("drop", (e) => {
          e.preventDefault();
          col.classList.remove("over");
          const t = pack.tasks.find((x) => x.id === e.dataTransfer.getData("text/plain"));
          if (t) { t.status = col.dataset.status; render(); }
        });
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
  </script>
</body>
</html>
