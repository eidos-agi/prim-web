<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prim demo — all five</title>
  <meta name="description" content="Click through docket, deck, invoice, session, and finance. Each file becomes an editor.">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./opff.css">
  <link rel="stylesheet" href="./omf.css">
  <style>
    :root {
      --paper: #f4f3ef;
      --raised: #fffcf8;
      --ink: #111111;
      --muted: #6a6a66;
      --subtle: #8a8a84;
      --line: #e4e2dc;
      --radius: 20px;
      --bg: #000;
      --side: #000;
      --elev: #141516;
      --hover: #18191b;
      --active: #1c1c1f;
      --eline: #232326;
      --text: #f7f8f8;
      --mute: #8a8f98;
      --faint: #62666d;
      --accent: #5e6ad2;
      --todo: #8a8f98;
      --progress: #f2c14e;
      --blocked: #eb5757;
      --done: #5e6ad2;
      --draft: #6b7180;
      --high: #eb5757;
      --medium: #f2c14e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    body {
      display: flex;
      flex-direction: row;
      background: var(--paper);
      color: var(--ink);
      color-scheme: light;
      font-family: "Instrument Sans", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.resizing, body.dragging-pane { user-select: none; }
    body.resizing-col { cursor: col-resize; }
    body.resizing-row { cursor: row-resize; }
    body.dragging-pane { cursor: grabbing; }
    .app-rail {
      display: none;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #000;
      color: #f7f8f8;
      color-scheme: dark;
      border-left: 1px solid #232326;
      isolation: isolate;
      contain: paint;
      overflow: hidden;
      z-index: 3;
    }
    body.docked .app-rail { display: flex; flex: 1 1 var(--pane-rail, 32rem); min-width: 16rem; }
    body.bare {
      display: block;
      background: #000;
    }
    body.bare .inbox,
    body.bare .split,
    body.bare .scrim,
    body.bare section.stage,
    body.bare .app-rail-bar,
    body.bare .app-rail-deck { display: none !important; }
    body.bare .app-rail {
      display: flex !important;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      flex: none;
    }
    .app-rail-bar {
      height: 4rem;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 1rem;
      border-bottom: 1px solid #232326;
      flex: none;
      overflow: hidden;
      background: #000;
    }
    .app-rail-bar .who { display: grid; line-height: 1.2; min-width: 0; flex: 1; overflow: hidden; }
    .app-rail-bar b, .app-rail-bar small {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .app-rail-bar b { font-weight: 500; letter-spacing: -0.02em; }
    .app-rail-bar small { color: #8a8f98; font-size: 12px; }
    .app-rail-bar button {
      margin-left: auto;
      height: 32px;
      padding: 0 10px;
      border: 1px solid #232326;
      border-radius: 10px;
      background: #141516;
      color: #f7f8f8;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      flex: none;
      white-space: nowrap;
    }
    .app-rail-deck {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px 12px 12px;
      border-bottom: 1px solid #232326;
      flex: none;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      isolation: isolate;
      background: #000;
    }
    .app-rail-deck[hidden] { display: none; }
    .rail-thumb {
      flex: 0 0 122px;
      width: 122px;
      padding: 0;
      border: 1px solid #232326;
      border-radius: 8px;
      background: #141516;
      color: #f7f8f8;
      cursor: pointer;
      scroll-snap-align: start;
      overflow: hidden;
      text-align: left;
      font: inherit;
    }
    .rail-thumb.on { border-color: #5e6ad2; box-shadow: inset 0 0 0 1px #5e6ad2; }
    .rail-thumb-preview {
      display: block;
      height: 68px;
      background: #000;
      position: relative;
    }
    .rail-thumb-preview.kind-bill { background: #f6efe4; }
    .rail-thumb-preview.kind-paper { background: #fffcf8; }
    .rail-thumb-preview.kind-arcade { background: #000; }
    .rail-thumb-preview.kind-opff { background: #000; }
    .rail-thumb-preview.kind-omf { background: #10120f; }
    .rail-thumb-preview.kind-deck { background: #000; }
    .rail-thumb-preview.kind-arcade::after,
    .rail-thumb-preview.kind-deck::after {
      content: "";
      position: absolute; inset: 14px 22px;
      border: 1px solid #3a3a40;
      background: #111;
    }
    .rail-thumb-preview.kind-bill::after,
    .rail-thumb-preview.kind-paper::after {
      content: "";
      position: absolute; inset: 12px 16px 18px;
      border-bottom: 1px solid #e4e2dc;
      background: #fff;
    }
    .rail-thumb-preview.kind-docket::after,
    .rail-thumb-preview.kind-opff::after {
      content: "";
      position: absolute; inset: 16px 10px 20px;
      background: repeating-linear-gradient(90deg, #1c1c1f 0 18px, transparent 18px 24px);
    }
    .rail-thumb-preview.kind-omf::after {
      content: "";
      position: absolute; inset: 16px 10px 20px;
      background: linear-gradient(90deg, #f3ece0 0 32%, #161310 32% 66%, #f7f1e6 66%);
    }
    .rail-thumb-cap {
      display: block;
      padding: 5px 7px 6px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-rail-deck .editor-card.is-thumb,
    .app-rail-deck .editor-card.is-thumb:has(.kind.arcade) {
      flex: 0 0 136px;
      width: 136px !important;
      height: 88px !important;
      max-height: 88px !important;
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      border: 1px solid #232326;
      border-radius: 8px;
      position: relative;
      background: #000;
      isolation: isolate;
      contain: paint;
      clip-path: inset(0);
    }
    .app-rail-deck .editor-card.is-thumb > * {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      transform: scale(0.2);
      transform-origin: top left;
      width: 500%;
      height: 500%;
      overflow: hidden;
    }
    .app-rail-deck .editor-card.is-thumb::after {
      content: attr(data-title);
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 4px 7px;
      background: linear-gradient(transparent, #000 55%);
      color: #f7f8f8;
      font-size: 11px;
      pointer-events: none;
    }
    .app-rail-body { flex: 1; min-height: 0; overflow: hidden; background: #000; isolation: isolate; contain: paint; }
    .app-rail-body .editor-card {
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
      isolation: isolate;
      container-name: prim rail;
    }
    #app-rail-hold {
      position: fixed;
      left: -120vw;
      top: 0;
      width: min(72vw, 960px);
      height: min(70vh, 720px);
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
    }
    .chat-bar .who { flex: 1; min-width: 0; }
    .chat-bar .dock {
      margin-left: auto;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      background: var(--ink);
      color: var(--paper);
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .chat-bar .dock:disabled { opacity: 0.32; cursor: default; }
    .chat-bar .dl { margin-left: 0; flex: none; }
    body.docked .chat-bar .dl { display: none; }
    body.docked .chat-bar .who small { display: none; }
    .inbox {
      display: flex; flex-direction: column; min-height: 0;
      flex: 0 0 var(--pane-inbox, 300px);
      width: var(--pane-inbox, 300px);
      min-width: 10rem;
      max-width: 46vw;
      border-right: 1px solid var(--line); background: var(--paper);
      overflow: hidden; isolation: isolate;
    }
    body.docked .inbox {
      flex-basis: var(--pane-inbox, 200px);
      width: var(--pane-inbox, 200px);
    }
    .inbox-head {
      height: 4rem; display: flex; align-items: center; gap: 10px;
      padding: 0 1rem; border-bottom: 1px solid var(--line);
      cursor: grab;
    }
    .inbox-head img { height: 1.75rem; }
    .inbox-head b { font-weight: 500; letter-spacing: -0.02em; }
    .rail { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 20px; scrollbar-gutter: stable; }
    .chats { padding: 0; }
    .reg { margin: 18px 4px 0; }
    .reg h2 {
      margin: 0 8px 6px;
      font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--subtle);
    }
    .reg ol { list-style: none; margin: 0; padding: 0; }
    .reg-item {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
      width: 100%; margin: 0; padding: 7px 8px; border: 0; border-radius: 10px;
      background: transparent; color: inherit; font: inherit; text-align: left;
    }
    button.reg-item { cursor: pointer; }
    button.reg-item:hover { background: var(--raised); }
    .reg-item.on { background: var(--raised); }
    .reg-item.dim { opacity: 0.45; }
    .reg-item .nm {
      font-family: "IBM Plex Mono", monospace; font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reg-item .mk {
      font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--subtle);
      white-space: nowrap;
    }
    .reg-item .sub {
      grid-column: 1 / -1; color: var(--muted); font-size: 12px; line-height: 1.3;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-item {
      display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center;
      width: 100%; margin: 0 0 4px; padding: 10px; border: 1px solid transparent;
      border-radius: 14px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .chat-item:hover { background: var(--raised); }
    .chat-item.on { background: var(--raised); border-color: var(--line); }
    .chat-item .face { width: 36px; height: 36px; }
    .chat-item > span:last-child { min-width: 0; display: grid; gap: 2px; }
    .chat-item .name { font-weight: 500; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item .preview { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .scrim { display: none; }
    .menu {
      display: none; width: 36px; height: 36px; margin-right: 4px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--raised);
      font: inherit; cursor: pointer;
    }
    section.stage {
      display: flex; flex-direction: column;
      flex: 1 1 var(--pane-stage, 28rem);
      min-width: 16rem; min-height: 0;
      background: var(--paper); overflow: hidden; isolation: isolate; z-index: 1;
    }
    .split {
      flex: none;
      width: 7px;
      margin: 0 -3px;
      background: transparent;
      cursor: col-resize;
      position: relative;
      z-index: 6;
      touch-action: none;
    }
    .split::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 2px; right: 2px;
      background: var(--line);
    }
    body.docked .split-rail::after { background: #232326; }
    .split:hover::after, .split.on::after { background: #5e6ad2; }
    body:not(.docked) .split-b { display: none; }
    .chat-bar .who, .app-rail-bar .who { cursor: grab; }
    .chat-bar {
      height: 4rem; display: flex; align-items: center; gap: 10px;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      overflow: hidden;
      flex: none;
    }
    .chat-bar a.home { display: flex; align-items: center; flex: none; }
    .chat-bar img { height: 1.75rem; width: auto; }
    .who { display: grid; line-height: 1.2; min-width: 0; }
    .who b, .who small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .who b { font-weight: 500; letter-spacing: -0.02em; }
    .who small { color: var(--subtle); font-size: 12px; font-weight: 400; }
    .chat-bar .dl {
      font-family: "IBM Plex Mono", monospace; font-size: 12px;
      color: var(--muted); text-decoration: none; border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 10px; background: var(--raised);
      max-width: 9.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-bar .dl:hover { color: var(--ink); }
    .thread { flex: 1; min-height: 0; overflow: auto; padding: 1.5rem 1.5rem 1rem; isolation: isolate; scroll-padding-top: 8px; }
    .day {
      display: flex; align-items: center; gap: 1rem;
      margin: 0 0 1.25rem; color: var(--subtle);
      font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .row { display: flex; gap: 10px; margin: 0 0 14px; max-width: 36rem; opacity: 0; transform: translateY(8px); animation: in 420ms ease forwards; }
    .row.tool { max-width: none; }
    .row.them { }
    .row.me { margin-left: auto; flex-direction: row-reverse; }
    .face {
      width: 28px; height: 28px; border-radius: 8px; flex: none;
      display: grid; place-items: center; background: var(--ink);
    }
    .face img { height: 14px; width: auto; filter: invert(1); }
    .row.me .face { background: var(--raised); border: 1px solid var(--line); }
    .row.me .face img { filter: none; }
    .stack { min-width: 0; }
    .meta {
      font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--subtle); margin: 0 0 5px;
    }
    .bubble {
      padding: 12px 16px; border-radius: var(--radius); line-height: 1.45; font-size: 1.02rem;
      border: 1px solid var(--line); background: var(--raised);
    }
    .row.me .bubble { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .typing { display: flex; gap: 5px; padding: 14px 16px; width: fit-content; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--subtle); animation: pulse 1s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @keyframes in { to { opacity: 1; transform: none; } }
    .drop {
      margin: 8px 0 0; max-width: 40rem; min-height: 7.5rem;
      border: 1px dashed var(--line); border-radius: var(--radius);
      background: var(--raised); display: grid; place-items: center;
      text-align: center; color: var(--muted); padding: 1.4rem 1.5rem; cursor: pointer;
    }
    .drop[hidden] { display: none; }
    .drop.over { border-style: solid; border-color: var(--ink); color: var(--ink); }
    .drop .label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--subtle); }
    .drop strong { display: block; margin: 0.4rem 0 0.2rem; font-weight: 500; letter-spacing: -0.02em; color: var(--ink); }
    .attach {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper);
    }
    .attach .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    .attach small { display: block; color: var(--subtle); font-size: 11px; }
    .composer {
      display: flex; align-items: center; gap: 10px;
      margin: 0 1.5rem 1.25rem; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 16px; background: var(--raised);
      min-width: 0; overflow: hidden;
    }
    .composer .tag {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--subtle);
      flex: none;
    }
    .composer .pending {
      display: none;
      max-width: 10rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      flex: none;
    }
    .composer .pending.on { display: inline-block; }
    section.stage.file-over,
    .composer.file-over { outline: 2px solid var(--ink); outline-offset: -2px; }
    .composer input {
      flex: 1; border: 0; background: transparent; font: inherit; color: var(--ink); outline: none;
    }
    .composer button {
      height: 34px; padding: 0 12px; border: 0; border-radius: 10px;
      background: var(--ink); color: var(--paper); font: inherit; font-weight: 500; cursor: pointer;
      flex: none;
    }
    body.docked .composer { margin: 0 0.75rem 0.85rem; }
    body.docked .thread { padding: 1rem 0.85rem 0.75rem; }
    .beat { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
    .beat button {
      height: 34px; padding: 0 12px; border: 0; border-radius: 10px;
      background: var(--ink); color: var(--paper); font: inherit; font-weight: 500; cursor: pointer;
    }
    .beat button:hover { opacity: 0.88; }
    .beat button[disabled] { opacity: 0.28; cursor: default; }
    .row.tool .bubble { padding: 0; overflow: hidden; max-width: 100%; width: min(100%, 72rem); background: #000; border-color: var(--ink); isolation: isolate; contain: paint; }
    .embed-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      height: 36px; padding: 0 10px;
      background: #141516; color: #d0d6e0; color-scheme: dark;
      font-size: 12px; border-bottom: 1px solid #232326;
    }
    .embed-bar button {
      height: 26px; padding: 0 10px;
      border: 1px solid #3a3a40; border-radius: 8px;
      background: #000; color: #f7f8f8;
      font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .app-rail-body .embed-bar { display: none; }
    .chat-thumb {
      display: none;
      align-items: center;
      gap: 10px;
      width: min(240px, 100%);
      padding: 6px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }
    .chat-thumb-preview {
      width: 76px;
      height: 46px;
      border-radius: 5px;
      flex: none;
      background: #000;
      border: 1px solid #232326;
    }
    .chat-thumb-preview.kind-bill { background: #f6efe4; }
    .chat-thumb-preview.kind-paper { background: #fffcf8; }
    .chat-thumb-preview.kind-arcade { background: #000; }
    .chat-thumb-preview.kind-omf {
      background: linear-gradient(90deg, #f3ece0 0 32%, #161310 32% 66%, #f7f1e6 66%);
    }
    .chat-thumb-cap { display: grid; gap: 2px; min-width: 0; }
    .chat-thumb-cap b { font-weight: 500; font-size: 13px; }
    .chat-thumb-cap small { color: var(--subtle); font-size: 11px; }
    .row.tool.in-rail .bubble {
      width: auto;
      max-width: 22rem;
      padding: 4px;
      background: var(--raised);
      color: var(--ink);
      color-scheme: light;
      border-color: var(--line);
    }
    .row.tool.in-rail .embed-bar { display: none; }
    .row.tool.in-rail .chat-thumb { display: flex; }
    .row.tool.in-rail .editor-card { display: none; }
    .editor-card {
      height: min(58vh, 620px);
      background: #000;
      color-scheme: dark;
      container-type: size;
      container-name: prim;
    }
    .app { width: 100%; min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      color-scheme: dark;
      font-family: Inter, "SF Pro Text", sans-serif;
      font-size: 13px;
    }
    .app.sheet-on {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) minmax(10rem, 38%);
    }
    .app aside {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: var(--side);
      border-bottom: 1px solid var(--eline);
      padding: 10px;
      overflow: auto;
    }
    .workspace { display: flex; align-items: center; gap: 10px; flex: 1 1 100%; padding: 0 4px 4px; }
    .mark-team { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #5e6ad2, #8b93e8); }
    .workspace h1 { margin: 0; font-size: 13px; font-weight: 500; }
    .workspace small { display: block; color: var(--faint); font-size: 11px; }

    .kind.paper {
      height: 100%; overflow: auto; padding: 28px 32px;
      background: #fffcf8; color: #111; color-scheme: light;
      font-family: "Instrument Sans", "Segoe UI", sans-serif;
    }
    .kind.paper h2 { margin: 0 0 12px; letter-spacing: -0.03em; font-weight: 600; }
    .kind.paper p { margin: 0 0 10px; line-height: 1.45; }
    .kind.paper .pack-files {
      list-style: none; margin: 22px 0 0; padding: 0;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #6a6a66;
    }
    .kind.paper .pack-files li { padding: 5px 0; border-top: 1px solid #e4e2dc; }
    .kind.paper .kicker { color: #8a8a84; }
    .chat-item.dim { opacity: 0.45; }
    .chats h2 {
      margin: 14px 8px 6px;
      font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--subtle);
    }
    .chats h2:first-child { margin-top: 4px; }
    @container prim (min-width: 640px) {
      .board {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: minmax(0, 1fr);
      }
    }
    @container prim (min-width: 1100px) {
      .app { grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
      .app.sheet-on { grid-template-columns: 200px minmax(0, 1fr) minmax(280px, 360px); grid-template-rows: minmax(0, 1fr); }
      .app aside {
        display: block;
        border-right: 1px solid var(--eline);
        border-bottom: 0;
        padding: 14px 10px;
      }
      .workspace { flex: none; padding: 4px 8px 14px; }
      .nav-item { width: 100%; height: 30px; }
    }
    @container prim (max-width: 859px) {
      .app.sheet-on { grid-template-columns: minmax(0, 1fr); }
      .sheet { border-left: 0; border-top: 1px solid var(--eline); }
      .rowi { grid-template-columns: 16px minmax(0, 1fr) auto; height: auto; min-height: 36px; padding: 8px 12px; }
      .rowi .tid, .rowi .chip { display: none; }
      .prop { grid-template-columns: 1fr; gap: 4px; }
      .title-edit { font-size: 18px; }
    }
    @container prim (max-width: 479px) {
      .board {
        display: flex;
        grid-template-columns: none;
        grid-template-rows: none;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
      }
      .col {
        flex: 0 0 min(78%, 16.5rem);
        height: 100%;
        max-height: none;
        scroll-snap-align: start;
      }
    }
    @container prim (max-width: 560px) {
      .app aside { padding: 8px; }
      .workspace small { display: none; }
      .kind.deck .slide { padding: 18px 16px; }
      .kind.deck .slide h2 { max-width: none; }
      .kind.deck .pick { flex: 0 0 120px; height: 80px; }
      .kind.bill .bill-top { flex-direction: column; }
      .kind.bill .bill-id { text-align: left; }
      .kind.bill .parties,
      .kind.bill .dates { grid-template-columns: 1fr; }
      .kind.bill .bill-foot { display: grid; }
      .kind.sess .sess-top { flex-direction: column; align-items: flex-start; }
      .kind.sess .sess-count { text-align: left; display: flex; align-items: baseline; gap: 8px; }
      .kind.sess .sess-count b { display: inline; font-size: 1.15rem; margin: 0; }
      .kind.sess li { grid-template-columns: 1fr; gap: 4px; }
      .kind.sess time { padding-top: 0; }
      .kind.sess .add-turn { flex-wrap: wrap; }
      .kind.sess .add-turn button { height: 36px; }
      .kind.seal { padding: 18px; }
      .kind.seal .pair { grid-template-columns: 1fr; gap: 2px; }
    }
    @media (max-width: 1100px) {
      .inbox {
        position: fixed; inset: 0 auto 0 0; width: min(88vw, 300px); z-index: 20;
        transform: translateX(-105%); transition: transform 180ms ease;
        box-shadow: 16px 0 40px rgba(17,17,17,0.08);
        flex: none;
        max-width: none;
      }
      body.show-chats .inbox { transform: none; }
      .scrim {
        display: none; position: fixed; inset: 0; z-index: 15;
        background: color-mix(in srgb, var(--ink) 28%, transparent);
      }
      body.show-chats .scrim { display: block; }
      .menu { display: grid; place-items: center; }
      .row { max-width: 100%; }
      .composer { margin: 0 0.85rem 0.85rem; }
      .thread { padding: 1rem; }
      body.docked section.stage { flex: 1 1 var(--pane-stage, 38vw); }
      body:not(.show-chats) .inbox { display: none; }
    }
    @media (max-width: 720px) {
      body.docked { flex-direction: column; }
      body.docked section.stage {
        flex: 0 0 var(--pane-stage-h, 30vh);
        min-width: 0;
        min-height: 10rem;
        max-height: 70vh;
      }
      body.docked .app-rail {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 12rem;
        border-left: 0;
        border-top: 1px solid #232326;
      }
      body.docked .split {
        width: 100%;
        height: 7px;
        margin: -3px 0;
        cursor: row-resize;
      }
      body.docked .split::after { top: 2px; bottom: 2px; left: 0; right: 0; }
    }
  </style>
</head>
<body>
  <div class="scrim" id="scrim"></div>
  <aside class="inbox" id="inbox">
    <div class="inbox-head">
      <a href="/"><img src="../../mark.png" alt="Prim"></a>
      <b>Chats</b>
    </div>
    <div class="rail">
    <nav class="chats" id="chats">
      <h2>Walks</h2>
      <button class="chat-item on" type="button" data-chat="tour">
        <span class="face"><img src="../../mark.png" alt=""></span>
        <span><span class="name">All six</span><span class="preview">Click through every kind.</span></span>
      </button>
      <button class="chat-item" type="button" data-chat="seal">
        <span class="face"><img src="../../mark.png" alt=""></span>
        <span><span class="name">Seal</span><span class="preview">Validate. Don’t read.</span></span>
      </button>
      <h2>OKF</h2>
      <div id="okf-chats"></div>
      <h2>Editors</h2>
      <div id="kind-chats"></div>
    </nav>
    <section class="reg" aria-labelledby="type-reg-h">
      <h2 id="type-reg-h">Prim registry</h2>
      <ol id="types"></ol>
    </section>
    <section class="reg" aria-labelledby="tool-reg-h">
      <h2 id="tool-reg-h">Prim tool registry</h2>
      <ol id="tools"></ol>
    </section>
    </div>
  </aside>
  <button class="split split-a" id="split-a" type="button" aria-label="Resize chats"></button>
  <section class="stage">
    <div class="chat-bar">
      <button class="menu" id="menu" type="button" aria-label="Chats">☰</button>
      <a class="home" href="/"><img src="../../mark.png" alt="Prim"></a>
      <div class="who"><b id="title">All six</b><small id="sub">bot · click through every kind</small></div>
      <button class="dock" id="dock-btn" type="button" disabled>Pop to sidebar</button>
      <a class="dl" href="./atlas.docket.prim" download="atlas.docket.prim">six prims</a>
    </div>
    <div class="thread" id="thread">
      <div class="day">Today</div>
      <div class="log" id="log-tour"></div>
      <div class="log" id="log-docket" hidden></div>
      <div class="log" id="log-deck" hidden></div>
      <div class="log" id="log-invoice" hidden></div>
      <div class="log" id="log-session" hidden></div>
      <div class="log" id="log-omf" hidden></div>
      <div class="log" id="log-arcade" hidden></div>
      <div class="log" id="log-seal" hidden></div>
      <div class="drop" id="drop" hidden>
        <div>
          <p class="label">Attach</p>
          <strong>Drop a .prim here</strong>
          or click to choose the file
        </div>
        <input id="file" type="file" accept=".prim,.zip,.nes,.z64,.n64,.v64,.wad,.json,.jsonl" hidden>
      </div>
    </div>
    <form class="composer" id="composer">
      <button class="tag" type="button" id="attach">.prim</button>
      <span class="pending" id="pending" hidden></span>
      <input id="prompt" placeholder="Message Prim…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
  <button class="split split-b" id="split-b" type="button" aria-label="Resize editor"></button>
  <aside class="app-rail" id="app-rail" hidden>
    <div class="app-rail-bar">
      <div class="who"><b id="app-rail-title">App</b><small id="app-rail-sub">cites the pack</small></div>
      <button type="button" id="app-rail-close">Pop back to chat</button>
    </div>
    <div class="app-rail-deck" id="app-rail-deck" hidden></div>
    <div class="app-rail-body" id="app-rail-body"></div>
    <div id="app-rail-hold" hidden></div>
  </aside>
  <script type="module">
    import { unzipSync, strFromU8 } from "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js";
    import { parseKind, renderKind, answerKind, steerKind, detectSystem } from "./kinds.js";
    import { FACES } from "./faces.js";
    import { createWalk } from "./tour.js";
    import { createSeal } from "./seal.js";
    import { stopArcade, loadFreedoom } from "./arcade.js";

    const COLUMNS = ["To Do", "In Progress", "Done", "Draft"];
    let pack = { project: { name: "docket" }, tasks: [], milestones: [] };
    const docketUI = { selected: "", view: "board", filter: "all" };
    const tourDocketUI = { selected: "", view: "board", filter: "all" };
    let current = "tour";

    const drop = document.getElementById("drop");
    const file = document.getElementById("file");
    const thread = document.getElementById("thread");
    const prompt = document.getElementById("prompt");
    const composer = document.getElementById("composer");
    const pendingEl = document.getElementById("pending");
    const stageEl = document.querySelector("section.stage");
    let pendingFile = null;
    let dropSeq = 0;
    function stageFile(f) {
      pendingFile = f;
      pendingEl.hidden = false;
      pendingEl.classList.add("on");
      pendingEl.textContent = f.name;
      prompt.placeholder = "Send to open this prim";
    }
    function clearPending() {
      pendingFile = null;
      pendingEl.hidden = true;
      pendingEl.classList.remove("on");
      pendingEl.textContent = "";
      prompt.placeholder = "Message Prim…";
    }
    function bindFileDrop(el) {
      el.addEventListener("dragover", (e) => {
        if (![...e.dataTransfer.types].includes("Files")) return;
        e.preventDefault();
        e.stopPropagation();
        el.classList.add("file-over");
      });
      el.addEventListener("dragleave", (e) => {
        if (el.contains(e.relatedTarget)) return;
        el.classList.remove("file-over");
      });
      el.addEventListener("drop", (e) => {
        if (!e.dataTransfer.files?.length) return;
        e.preventDefault();
        e.stopPropagation();
        el.classList.remove("file-over");
        receivePrim(e.dataTransfer.files[0]);
      });
    }
    drop.addEventListener("click", () => file.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) receivePrim(e.dataTransfer.files[0]); });
    file.addEventListener("change", () => { if (file.files[0]) receivePrim(file.files[0]); file.value = ""; });
    document.getElementById("attach").addEventListener("click", () => file.click());
    bindFileDrop(stageEl);
    bindFileDrop(composer);
    document.getElementById("menu").addEventListener("click", () => document.body.classList.toggle("show-chats"));
    document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("show-chats"));
    document.querySelectorAll("[data-chat]").forEach((el) => {
      el.addEventListener("click", () => openChat(el.dataset.chat));
    });

    const rooms = {
      tour: {
        title: "All six", sub: "bot · click through every kind",
        file: "atlas.docket.prim", size: "",
        started: false, pack: null, walk: true,
      },
      docket: {
        title: "Docket", sub: "bot · the file is the message",
        file: "atlas.docket.prim", size: "2 KB",
        preview: "Send me the prim.",
        open: "Don’t send the spreadsheet.",
        offer: "Send me the prim. I can open a docket editor on it.",
        after: "You can keep talking. Ask what’s blocked, or what’s to do.",
        started: false, pack: null,
      },
      deck: {
        title: "Deck", sub: "bot · slides come out of the file",
        file: "north.deck.prim", size: "686 B",
        preview: "Don’t send the slides.",
        open: "Don’t send the slides.",
        offer: "Send me the prim. The deck is a view of that file.",
        after: "Arrows move the slides. Click a line to edit. Ask how many slides.",
        started: false, pack: null,
      },
      invoice: {
        title: "Invoice", sub: "bot · the pack is the bill",
        file: "harbor.invoice.prim", size: "647 B",
        preview: "The pack is the bill.",
        open: "Don’t send the PDF.",
        offer: "Send me the prim. The pack is the bill.",
        after: "Ask for the total, or edit a line.",
        started: false, pack: null,
      },
      session: {
        title: "Session", sub: "bot · pick up the same file",
        file: "june.session.prim", size: "666 B",
        preview: "Pick up the same file.",
        open: "Don’t paste the transcript.",
        offer: "Send the session prim. The next window opens the same file.",
        after: "Log a turn in the editor, or ask what was last said.",
        started: false, pack: null,
      },
      omf: {
        title: "Meeting", sub: "bot · the occurrence is the pack",
        file: "june.omf.prim", size: "5.7 KB",
        preview: "RSVP is not attendance.",
        open: "Don’t send the calendar.",
        offer: "Send the meeting prim. omf-editor cites that file.",
        after: "Invite, record, and outcome stay separate. Ask who attended or what was decided.",
        started: false, pack: null,
      },
      arcade: {
        title: "Arcade", sub: "bot · Prim Arcade",
        file: "prim.arcade.prim", size: "686 B",
        preview: "NES or N64. The cart is the file.",
        open: "Don’t send the ROM as an attachment dump.",
        offer: "Send the arcade prim. NES opens on JSNES. N64 waits for Play, then EmulatorJS.",
        after: "NES: arrows, X, Z, Enter. N64: Play loads the core. Lawful carts only.",
        started: false, pack: null,
      },
      seal: {
        title: "Seal", sub: "bot · validate, don’t read",
        file: "atlas.docket.prim", size: "2 KB",
        started: false, pack: null, walk: true,
      },
    };
    for (const [id, f] of Object.entries(FACES)) {
      if (rooms[id]) {
        rooms[id].face = true;
        continue;
      }
      rooms[id] = {
        title: f.title,
        sub: "bot · " + id,
        file: f.file,
        size: f.size,
        preview: f.preview,
        open: f.open,
        offer: f.offer,
        after: f.after,
        started: false,
        pack: null,
        face: true,
        dim: id === "obf",
      };
    }

    const live = new Set(Object.keys(rooms).filter((id) => !rooms[id].walk));

    function ensureLog(id) {
      if (document.getElementById("log-" + id)) return;
      const el = document.createElement("div");
      el.className = "log";
      el.id = "log-" + id;
      el.hidden = true;
      thread.insertBefore(el, drop);
    }
    function chatButton(id, label) {
      const r = rooms[id];
      const b = document.createElement("button");
      b.className = "chat-item" + (r.dim ? " dim" : "");
      b.type = "button";
      b.dataset.chat = id;
      b.innerHTML = `<span class="face"><img src="../../mark.png" alt=""></span><span><span class="name">${esc(label || r.title)}</span><span class="preview">${esc(r.preview || r.open)}</span></span>`;
      b.addEventListener("click", () => openChat(id));
      return b;
    }
    function mountPrimChats() {
      const okf = document.getElementById("okf-chats");
      const kinds = document.getElementById("kind-chats");
      for (const [id, f] of Object.entries(FACES)) {
        ensureLog(id);
        okf.appendChild(chatButton(id, f.title));
      }
      for (const id of ["docket", "deck", "invoice", "session", "omf", "arcade"]) {
        ensureLog(id);
        kinds.appendChild(chatButton(id));
      }
    }
    function paintReg(id) {
      document.querySelectorAll("#types .reg-item").forEach((el) => {
        el.classList.toggle("on", el.dataset.type === id || (id === "seal" && el.dataset.type === "docket"));
      });
      document.querySelectorAll("#tools .reg-item").forEach((el) => {
        const tool = el.dataset.tool;
        if (id === "seal") el.classList.toggle("on", tool === "docket-webmcp");
        else el.classList.toggle("on", el.dataset.cites === id && tool !== "docket-webmcp");
      });
    }
    async function loadReg() {
      let data;
      try {
        data = await (await fetch("./registry.json")).json();
      } catch {
        document.getElementById("types").innerHTML = "<li class=\"reg-item dim\"><span class=\"nm\">unavailable</span></li>";
        return;
      }
      const types = document.getElementById("types");
      const tools = document.getElementById("tools");
      types.innerHTML = data.types.map((t) => {
        const mark = (t.okf ? "okf · " : "") + t.status;
        const open = live.has(t.name);
        const cls = "reg-item" + (t.status === "private" ? " dim" : "");
        const inner = `<span class="nm">${esc(t.name)}</span><span class="mk">${esc(mark)}</span><span class="sub">${esc(t.description)}</span>`;
        return open
          ? `<li><button class="${cls}" type="button" data-type="${esc(t.name)}">${inner}</button></li>`
          : `<li class="${cls}" data-type="${esc(t.name)}">${inner}</li>`;
      }).join("");
      tools.innerHTML = data.tools.map((t) => {
        const mark = `${t.kind}/${t.direction}`;
        const line = (t.as ? `(${t.as}) ` : "") + `${t.kind}/${t.direction} cites ${t.cites}`;
        const open = live.has(t.cites) || t.name === "prim-viewer";
        const inner = `<span class="nm">${esc(t.name)}</span><span class="mk">${esc(mark)}</span><span class="sub">${esc(line)}</span>`;
        return open
          ? `<li><button class="reg-item" type="button" data-cites="${esc(t.cites)}" data-tool="${esc(t.name)}">${inner}</button></li>`
          : `<li class="reg-item" data-cites="${esc(t.cites)}">${inner}</li>`;
      }).join("");
      types.querySelectorAll("[data-type]").forEach((el) => {
        if (el.tagName === "BUTTON") el.addEventListener("click", () => openChat(el.dataset.type));
      });
      tools.querySelectorAll("[data-cites]").forEach((el) => {
        if (el.tagName !== "BUTTON") return;
        el.addEventListener("click", () => {
          openChat(el.dataset.tool === "docket-webmcp" ? "seal" : el.dataset.tool === "prim-viewer" ? "obif" : el.dataset.cites);
        });
      });
      paintReg(current);
    }

    function logEl(id = current) { return document.getElementById("log-" + id); }
    function room(id = current) { return rooms[id]; }
    const appRail = document.getElementById("app-rail");
    const appRailBody = document.getElementById("app-rail-body");
    const dockBtn = document.getElementById("dock-btn");

    function toolMount(frameId) {
      return `<div class="embed-bar"><span>Prim tool</span><button type="button" class="pop-side">Pop to sidebar</button></div><button type="button" class="chat-thumb" hidden data-frame="${frameId}"><span class="chat-thumb-preview"></span><span class="chat-thumb-cap"><b></b><small>in sidebar</small></span></button><div class="editor-card" id="${frameId}"></div>`;
    }
    function activeFrame(id = current) {
      const r = rooms[id] || {};
      if (r.frameId) {
        const named = document.getElementById(r.frameId);
        if (named) return named;
      }
      return document.getElementById("frame-" + id);
    }
    const shelf = { items: [], active: null };
    const appRailDeck = document.getElementById("app-rail-deck");
    const inboxEl = document.getElementById("inbox");
    const splitA = document.getElementById("split-a");
    const splitB = document.getElementById("split-b");
    const PANE_KEY = "prim-docket-panes";
    const paneState = (() => {
      try {
        const raw = JSON.parse(localStorage.getItem(PANE_KEY) || "{}");
        const order = Array.isArray(raw.order) && raw.order.length === 3 ? raw.order : ["inbox", "stage", "rail"];
        return {
          inbox: Number(raw.inbox) || 0,
          stage: Number(raw.stage) || 0,
          rail: Number(raw.rail) || 0,
          stageH: Number(raw.stageH) || 0,
          order,
        };
      } catch {
        return { inbox: 0, stage: 0, rail: 0, stageH: 0, order: ["inbox", "stage", "rail"] };
      }
    })();
    function savePanes() {
      localStorage.setItem(PANE_KEY, JSON.stringify(paneState));
    }
    function paneMap() {
      return { inbox: inboxEl, stage: stageEl, rail: appRail };
    }
    function drawerInbox() {
      return window.matchMedia("(max-width: 1100px)").matches;
    }
    function stackedPanes() {
      return document.body.classList.contains("docked") && window.matchMedia("(max-width: 720px)").matches;
    }
    function applyPaneVars() {
      const b = document.body.style;
      if (paneState.inbox) b.setProperty("--pane-inbox", paneState.inbox + "px");
      if (paneState.stage) b.setProperty("--pane-stage", paneState.stage + "px");
      if (paneState.rail) b.setProperty("--pane-rail", paneState.rail + "px");
      if (paneState.stageH) b.setProperty("--pane-stage-h", paneState.stageH + "px");
    }
    function layoutPanes() {
      applyPaneVars();
      const map = paneMap();
      const docked = document.body.classList.contains("docked");
      const vis = paneState.order.filter((id) => {
        if (id === "rail" && !docked) return false;
        if (id === "inbox" && drawerInbox()) return false;
        return true;
      });
      const splits = [splitA, splitB];
      const kids = [document.getElementById("scrim")];
      vis.forEach((id, i) => {
        kids.push(map[id]);
        if (i < vis.length - 1) {
          const split = splits[i];
          split.hidden = false;
          split.dataset.left = id;
          split.dataset.right = vis[i + 1];
          split.setAttribute("aria-label", "Resize panes");
          kids.push(split);
        }
      });
      splits.forEach((s) => { if (!kids.includes(s)) { s.hidden = true; document.body.appendChild(s); } });
      [inboxEl, stageEl, appRail].forEach((n) => { if (!kids.includes(n)) kids.push(n); });
      kids.forEach((n) => n && document.body.appendChild(n));
    }

    function frameKind(frame) {
      if (!frame) return "prim";
      if (frame.querySelector(".app")) return "docket";
      const kind = frame.querySelector(".kind");
      if (!kind) return "prim";
      return [...kind.classList].find((c) => c !== "kind") || "prim";
    }
    function titleFor(frame) {
      const known = shelf.items.find((row) => row.frameId === frame?.id);
      if (known) return known.title;
      const text = frame?.querySelector(".workspace h1, h2, .kicker")?.textContent || "";
      return text.split("·")[0].trim() || frameKind(frame);
    }
    function shelfHas(frameId) {
      return shelf.items.some((item) => item.frameId === frameId);

          const vert = stackedPanes();
          document.body.classList.add("resizing", vert ? "resizing-row" : "resizing-col");
          const map = paneMap();
          const left = map[split.dataset.left];
          const right = map[split.dataset.right];
          if (!left || !right) return;
          const l0 = vert ? left.getBoundingClientRect().height : left.getBoundingClientRect().width;
          const r0 = vert ? right.getBoundingClientRect().height : right.getBoundingClientRect().width;
          const start = vert ? e.clientY : e.clientX;
          const minL = split.dataset.left === "inbox" ? 140 : 220;
          const minR = split.dataset.right === "inbox" ? 140 : 220;
          const move = (ev) => {
            const d = (vert ? ev.clientY : ev.clientX) - start;
            const nl = Math.max(minL, Math.min(l0 + r0 - minR, l0 + d));
            const nr = l0 + r0 - nl;
            const lid = split.dataset.left;
            const rid = split.dataset.right;
            if (vert) {
              if (lid === "stage") paneState.stageH = Math.round(nl);
              if (rid === "stage") paneState.stageH = Math.round(nr);
            } else {
              paneState[lid] = Math.round(nl);
              paneState[rid] = Math.round(nr);
            }
            applyPaneVars();
          };
          const up = () => {
            split.classList.remove("on");
            document.body.classList.remove("resizing", "resizing-col", "resizing-row");
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
            savePanes();
            nudgeFit();
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });
      };
      bindSplit(splitA);
      bindSplit(splitB);
      const bindDrag = (handle, id) => {
        handle.addEventListener("pointerdown", (e) => {
          if (e.button || e.target.closest("button, a, input")) return;
          const origin = { x: e.clientX, y: e.clientY, go: false };
          const move = (ev) => {
            if (!origin.go && Math.hypot(ev.clientX - origin.x, ev.clientY - origin.y) < 8) return;
            origin.go = true;
            document.body.classList.add("dragging-pane");
          };
          const up = (ev) => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
            document.body.classList.remove("dragging-pane");
            if (!origin.go) return;
            const hit = document.elementFromPoint(ev.clientX, ev.clientY);

            const dest = over === inboxEl ? "inbox" : over === stageEl ? "stage" : over === appRail ? "rail" : "";
            if (!dest || dest === id) return;
            const i = paneState.order.indexOf(id);
            const j = paneState.order.indexOf(dest);
            if (i < 0 || j < 0) return;
            const next = paneState.order.slice();
            next[i] = dest;
            next[j] = id;
            paneState.order = next;

            layoutPanes();
            nudgeFit();
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });

      if (system) {
        return { kind: "arcade", project: { name: f.name || "cart" }, system, rom: buf };
      }
      if (buf[0] === 0x50 && buf[1] === 0x4b) {
        const zip = unzipSync(buf);
        const files = {};
        for (const [k, v] of Object.entries(zip)) {
          if (k.endsWith("/") || k.includes("__MACOSX")) continue;
          const name = k.replace(/^\.\//, "");
          files[name] = /\.(nes|z64|n64|v64|wad)$/i.test(name) ? v : strFromU8(v);
        }
        return parseKind(files);
      }
      const text = new TextDecoder().decode(buf);
      if (text.trim().startsWith("{") && text.includes('"tasks"')) {
        const j = JSON.parse(text);
        return { kind: "docket", project: j.project || { name: j.name || f.name }, tasks: j.tasks || [], milestones: j.milestones || [] };
      }
      return parseKind({ "tasks.jsonl": text });
    }

    function kind(t) {
      if (t.blocked_reason) return "blocked";
      if (t.status === "In Progress") return "progress";
      if (t.status === "Done") return "done";
      if (t.status === "Draft") return "draft";
      return "todo";
    }
    function statusMark(t) {
      const k = kind(t);
      if (k === "done") return `<svg class="icon done" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M4.2 7.1l1.8 1.8 3.8-3.8"/></svg>`;
      if (k === "progress") return `<svg class="icon progress" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M7 2.2A4.8 4.8 0 0 1 11.8 7H7z"/></svg>`;
      if (k === "blocked") return `<svg class="icon blocked" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M4.2 4.2l5.6 5.6"/></svg>`;
      return `<svg class="icon ${k}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/></svg>`;
    }
    function priMark(p) {
      const n = p === "high" ? 3 : p === "medium" ? 2 : p === "low" ? 1 : 0;
      if (!n) return `<svg class="pri" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.6 1.5"/></svg>`;
      return `<svg class="pri ${p}" viewBox="0 0 14 14">${[[3,10],[6,8],[9,6]].slice(0,n).map(([x,h]) => `<rect x="${x}" y="${12-h}" width="2" height="${h}" rx="0.6" fill="currentColor"/>`).join("")}</svg>`;
    }
    function msTitle(id, src) {
      return ((src || pack).milestones.find((m) => m.id === id) || {}).title || id;
    }
    function visible(src, ui) {
      return src.tasks.filter((t) => {
        if (ui.filter === "blocked") return !!t.blocked_reason;
        if (ui.filter !== "all" && t.status !== ui.filter) return false;
        return true;
      });
    }
    function counts(src) {
      const c = { all: src.tasks.length, "To Do": 0, "In Progress": 0, Done: 0, Draft: 0, blocked: 0 };
      for (const t of src.tasks) {
        c[t.status] = (c[t.status] || 0) + 1;
        if (t.blocked_reason) c.blocked += 1;
      }
      return c;
    }

    function render(rootId = "frame-docket", src = pack, ui = docketUI) {
      const root = document.getElementById(rootId);
      if (!root) return;
      const c = counts(src);
      const t = src.tasks.find((x) => x.id === ui.selected);
      const filters = [["all","All issues"],["To Do","Todo"],["In Progress","In Progress"],["Done","Done"],["Draft","Draft"],["blocked","Blocked"]];
      root.innerHTML = `
        <div class="app ${t ? "sheet-on" : ""}">
          <aside>
            <div class="workspace"><div class="mark-team"></div><div><h1>${esc(src.project.name || "docket")}</h1><small>docket editor · cites this file</small></div></div>
            ${filters.map(([id, label]) => `<button class="nav-item ${ui.filter===id?"on":""}" data-filter="${id}"><span>${statusMark({status:id==="In Progress"?"In Progress":id==="Done"?"Done":id==="Draft"?"Draft":"To Do", blocked_reason:id==="blocked"?"x":""})}${label}</span><span class="count">${c[id]||0}</span></button>`).join("")}
          </aside>
          <main class="ed">
            <div class="toolbar">
              <h2>${ui.filter==="all"?"All issues":ui.filter}</h2>
              <div class="views">
                <button type="button" data-view="list" class="${ui.view==="list"?"on":""}" title="List">≡</button>
                <button type="button" data-view="board" class="${ui.view==="board"?"on":""}" title="Board">▣</button>
              </div>
            </div>
            <div class="list">${ui.view==="board"?boardHTML(src, ui):listHTML(src, ui)}</div>
          </main>
          ${t ? sheetHTML(t, src) : ""}
        </div>`;
      bind(root, src, ui, rootId);
    }

    function listHTML(src, ui) {
      const rows = visible(src, ui);
      if (!rows.length) return '<div class="empty">No issues.</div>';
      return rows.map((t) => `
        <div class="rowi ${t.id===ui.selected?"on":""}" data-id="${t.id}">
          ${statusMark(t)}<span class="tid">${t.id.replace("TASK-","")}</span>
          <span class="title">${esc(t.title)}</span>
          ${t.milestone?`<span class="chip">${esc(msTitle(t.milestone, src))}</span>`:"<span></span>"}
          ${priMark(t.priority)}
        </div>`).join("");
    }

    function boardHTML(src, ui) {
      const cols = ui.filter !== "all" && ui.filter !== "blocked" ? [ui.filter] : COLUMNS;
      return `<div class="board">${cols.map((status) => {
        const cards = visible(src, ui).filter((t) => t.status === status);
        return `<section class="col" data-status="${status}">
          <div class="col-head">${statusMark({status})}${status==="To Do"?"Todo":status}<span class="count">${cards.length}</span></div>
          <div class="col-body">${cards.map((t) => `
            <article class="card" data-id="${t.id}" draggable="true">
              <div class="card-title">${esc(t.title)}</div>
              <div class="card-meta">
                <span class="tid">${t.id.replace("TASK-","")}</span>
                ${t.blocked_reason?'<span class="chip" style="color:var(--blocked)">Blocked</span>':""}
                ${t.milestone?`<span class="chip">${esc(msTitle(t.milestone, src))}</span>`:""}
                <span style="margin-left:auto">${priMark(t.priority)}</span>
              </div>
            </article>`).join("")}</div>
        </section>`;
      }).join("")}</div>`;
    }

    function sheetHTML(t, src) {
      const ms = src.milestones.map((m) => `<option value="${esc(m.id)}" ${m.id===t.milestone?"selected":""}>${esc(m.title)}</option>`).join("");
      return `<section class="sheet">
        <button type="button" class="sheet-close" data-close aria-label="Close issue">×</button>
        <div class="issue-id">${esc(t.id)}</div>
        <textarea class="title-edit" data-field="title">${esc(t.title)}</textarea>
        <label class="prop"><span>Status</span><select data-field="status">${["To Do","In Progress","Done","Draft"].map((s)=>`<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select></label>
        <label class="prop"><span>Priority</span><select data-field="priority">${["","high","medium","low"].map((s)=>`<option value="${s}" ${s===(t.priority||"")?"selected":""}>${s||"No priority"}</option>`).join("")}</select></label>
        <label class="prop"><span>Milestone</span><select data-field="milestone"><option value="">No milestone</option>${ms}</select></label>
        <label class="prop"><span>Blocked</span><input class="blocked-edit" data-field="blocked_reason" value="${esc(t.blocked_reason||"")}"></label>
        <textarea class="notes" data-field="notes" placeholder="Add description…">${esc(t.notes||"")}</textarea>
      </section>`;
    }

    function bind(root, src, ui, rootId) {
      root.querySelectorAll("[data-filter]").forEach((el) => el.addEventListener("click", () => { ui.filter = el.dataset.filter; render(rootId, src, ui); }));
      root.querySelectorAll("[data-view]").forEach((el) => el.addEventListener("click", () => { ui.view = el.dataset.view; render(rootId, src, ui); }));
      root.querySelector("[data-close]")?.addEventListener("click", () => { ui.selected = ""; render(rootId, src, ui); });
      root.querySelectorAll(".rowi, .card").forEach((el) => el.addEventListener("click", () => { ui.selected = el.dataset.id; render(rootId, src, ui); }));
      root.querySelectorAll("[data-field]").forEach((el) => {
        const ev = el.tagName === "SELECT" ? "change" : "blur";
        el.addEventListener(ev, () => {
          const t = src.tasks.find((x) => x.id === ui.selected);
          if (t) { t[el.dataset.field] = el.value; render(rootId, src, ui); }
        });
      });
      root.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", el.dataset.id));
      });
      root.querySelectorAll(".col").forEach((col) => {
        col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("over"); });
        col.addEventListener("dragleave", () => col.classList.remove("over"));
        col.addEventListener("drop", (e) => {
          e.preventDefault();
          col.classList.remove("over");
          const t = src.tasks.find((x) => x.id === e.dataTransfer.getData("text/plain"));
          if (t) { t.status = col.dataset.status; render(rootId, src, ui); }
        });
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    const sealDocketUI = { selected: "", view: "board", filter: "all" };
    const seal = createSeal({
      add: (who, html) => add(who, html, "", "seal"),
      say: (html) => say(html, "seal"),
      attachHTML,
      esc,
      root: () => logEl("seal"),
      scroll() { thread.scrollTop = thread.scrollHeight; },
      alive: () => rooms.seal.gen === rooms.seal.playGen,
      tryYourself: () => offerRetry("seal"),
      fetchPrim,
      showSeal({ file, records }) {
        const tool = add("them", toolMount("frame-seal"), "tool", "seal");
        rooms.seal.frameId = "frame-seal";
        document.getElementById("frame-seal").innerHTML = `
          <div class="kind seal">
            <p class="kicker">docket-editor · validate</p>
            <h2>Readable</h2>
            <div class="pair"><dt>File</dt><dd class="mono">${esc(file)}</dd></div>
            <div class="pair"><dt>Records</dt><dd>${records}</dd></div>
            <div class="pair"><dt>To the model</dt><dd>nothing</dd></div>
            <p class="note">The tool checked the pack opens. It did not hand titles, notes, or blockers to the model.</p>
          </div>`;
        thread.scrollTop = tool.offsetTop;
      },
      showExposed(parsed) {
        let frame = document.getElementById("frame-seal");
        if (!frame) {
          add("them", toolMount("frame-seal"), "tool", "seal");
          rooms.seal.frameId = "frame-seal";
          frame = document.getElementById("frame-seal");
        }
        frame.innerHTML = `<div class="mcp-bar"><b>docket-webmcp</b> · connector/talk · local model can operate this editor</div><div id="frame-seal-docket" style="height:calc(100% - 38px)"></div>`;
        render("frame-seal-docket", parsed, sealDocketUI);
        rooms.seal.pack = parsed;
      },
    });

    const walk = createWalk({
      room: (id) => rooms[id],
      add: (who, html) => add(who, html, "", "tour"),
      say: (html) => say(html, "tour"),
      attachHTML,
      esc,
      root: () => logEl("tour"),
      scroll() { thread.scrollTop = thread.scrollHeight; },
      alive: () => rooms.tour.gen === rooms.tour.playGen,
      tryYourself: () => offerRetry("tour"),
      setKind(id) {
        const r = rooms[id];
        const dl = document.querySelector(".chat-bar .dl");
        dl.href = "./" + r.file;
        dl.download = r.file;
        dl.textContent = r.file;
        rooms.tour.file = r.file;
        const prev = document.querySelector('[data-chat="tour"] .preview');
        if (prev) prev.textContent = r.title + " · in this thread";
      },
      fetchPrim,
      async openEditor(kind, parsed) {
        const id = "frame-tour-" + kind;
        add("them", toolMount(id), "tool", "tour");
        rooms.tour.frameId = id;
        rooms.tour.pack = parsed;
        if (kind === "docket") render(id, parsed, tourDocketUI);
        else await renderKind(document.getElementById(id), parsed, () => {});
        const frame = document.getElementById(id);
        rooms.tour.surface = frame?._surface || null;
        rooms.tour.docked = true;
        if (current === "tour" && frame) {
          dockFrame(frame, parsed.project?.name || kind, kind + " · chat still points this");
        } else {
          paintDock();
        }
      },
    });

    bindPanes();
    mountPrimChats();
    loadReg();
    paintDock();
    const BARE = new URLSearchParams(location.search);
    function roomForViewer(q) {
      const raw = String(q || "").toLowerCase();
      if (raw === "seal" || raw === "docket-webmcp") return "seal";
      if (raw === "prim-arcade" || raw === "arcade") return "arcade";
      if (raw === "prim-viewer") return "obif";
      const cites = raw.replace(/-editor$/, "");
      return rooms[cites] ? cites : "";
    }
    async function bootBare() {
      if (!BARE.has("bare")) return false;
      document.body.classList.add("bare", "docked");
      document.getElementById("app-rail").hidden = false;
      const id = roomForViewer(BARE.get("kind") || BARE.get("tool")) || "opff";
      openChat(id, { skipPlay: true });
      const parsed = await fetchPrim(rooms[id].file);
      rooms[id].pack = parsed;
      rooms[id].started = true;
      rooms[id].docked = true;
      if (parsed.kind === "docket") pack = parsed;
      await showEditor(id, parsed);
      window.parent.postMessage({ type: "prim-bare-ready", kind: id }, "*");
      return true;
    }
    window.addEventListener("message", async (e) => {
      if (!document.body.classList.contains("bare")) return;
      if (e.data?.type !== "prim-drop") return;
      const f = new File([e.data.bytes], e.data.name || "drop.prim");
      const parsed = await readPack(f);
      const id = rooms[parsed.kind] ? parsed.kind : current;
      if (id !== current) openChat(id, { skipPlay: true });
      rooms[id].pack = parsed;
      rooms[id].started = true;
      rooms[id].docked = true;
      if (parsed.kind === "docket") pack = parsed;
      await showEditor(id, parsed);
    });
    bootBare().then((bare) => { if (!bare) play("tour"); });
  </script>
</body>
</html>
