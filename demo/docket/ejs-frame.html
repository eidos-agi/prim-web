<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prim Arcade</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #mode {
      position: absolute; left: 8px; bottom: 8px; margin: 0;
      color: #8a8f98; font: 11px/1 "IBM Plex Mono", ui-monospace, monospace;
      pointer-events: none; z-index: 2;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <p id="mode"></p>
  <script>
    const isolated = !!self.crossOriginIsolated;
    const sab = typeof SharedArrayBuffer === "function";
    let started = false;

    function start(msg) {
      if (started || !msg || !msg.rom) return;
      started = true;
      const badge = document.getElementById("mode");
      if (badge) badge.hidden = true;
      const rom = msg.rom instanceof ArrayBuffer ? msg.rom : new Uint8Array(msg.rom).buffer;
      const blob = new Blob([rom], { type: "application/octet-stream" });
      window.EJS_player = "#game";
      window.EJS_core = msg.core || "prboom";
      window.EJS_gameName = msg.name || "game";
      window.EJS_gameUrl = URL.createObjectURL(blob);
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_color = "#111111";
      window.EJS_threads = isolated && sab;
      window.EJS_disableLocalStorage = true;
      window.EJS_defaultOptions = {
        vsync: "disabled",
        shader: "disabled",
      };
      const s = document.createElement("script");
      s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(s);
    }

    window.addEventListener("message", (e) => {
      if (e.source !== parent) return;
      if (e.data && e.data.type === "rom") start(e.data);
    });
    const threads = isolated && sab;
    const mode = document.getElementById("mode");
    if (mode) mode.textContent = threads ? "threads · 60 fps" : "single-thread";
    parent.postMessage({ type: "ejs-ready", isolated, sab, threads }, "*");
  </script>
</body>
</html>
