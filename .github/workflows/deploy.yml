name: Deploy to Railway

on:
  push:
    branches: [main]

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        # No --detach: railway up streams build logs and exits non-zero if
        # the build fails. The action passes only when production actually
        # deployed. Closes the INC-001 gap where --detach made the action
        # return success while Railway was still (or silently failed to)
        # build. No untrusted inputs are used in this step.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: railway up --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT"
        timeout-minutes: 20
